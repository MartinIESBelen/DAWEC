<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="bg-dark text-white text-center py-4">
    <h1>CineManager 🎬</h1>
</header>

<main class="container my-5">
    <div class="row">
        <div class="col-md-8">
            <h2 class="mb-3">En Cartelera</h2>
            <div id="contenedor-peliculas" class="row"></div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h2 class="mb-3">Tus Entradas</h2>
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>Peli</th>
                        <th>Cant.</th>
                        <th>Subtotal</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="lista-tickets">
                    </tbody>
                </table>
                <hr>
                <div class="d-flex justify-content-between fs-4 fw-bold">
                    <span>Total:</span>
                    <span><span id="precio-final">0.00</span> €</span>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="data.js"></script>
<script src="cine.js"></script>
</body>
</html>
