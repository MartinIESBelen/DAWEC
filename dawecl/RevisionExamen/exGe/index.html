<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Datos Alumos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 10px;
        }

        .paises-column {
            width: 30%;
        }

        .form-column {
            width: 70%;
        }

        form {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 3px;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: #f5f5f5;
        }

        select[disabled] {
            background-color: #f5f5f5;
        }

        .section {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .city-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        .city-row input {
            flex: 1;
        }

        .city-row button {
            padding: 5px 10px;
            background: #ff4d4d;
            color: white;
            border: none;
            cursor: pointer;
        }

        .language-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        .language-row input {
            flex: 1;
        }

        .language-row button {
            padding: 5px 10px;
            background: #ff4d4d;
            color: white;
            border: none;
            cursor: pointer;
        }

        button.add-city, button.add-language {
            background: #4CAF50;
            color: white;
            padding: 10px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }

        button.add-city:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button[type="submit"] {
            background: #2196F3;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        #output {
            margin-top: 20px;
            width: 100%;
        }

        .paises-list {
            list-style: none;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .paises-list li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .paises-list li:hover {
            background-color: #f0f0f0;
        }

        .paises-list li.selected {
            background-color: #d4edda;
            font-weight: bold;
        }

        button.reset-form {
            background: #ff9800;
            color: white;
            padding: 10px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="alumnos-column">
        <ul id="nombresList" class="alumnos-list"></ul>
    </div>
    <div class="form-column">
        <form id="paisForm">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required readonly>

            <label for="fechaNac">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNac" name="fechaNac" readonly>

            <button type="submit">Mostrar como JSON</button>
        </form>
    </div>
</div>
<script src="script.js"></script>
<script src="listAlumnos.js"></script>
</body>
</html>
