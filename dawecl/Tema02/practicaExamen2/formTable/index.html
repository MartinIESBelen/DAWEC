<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario → Tabla</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input[type="text"],
        input[type="number"] {
            width: 220px;
            padding: 6px;
            margin-top: 5px;
        }

        .radio-group {
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            padding: 8px 18px;
            cursor: pointer;
        }

        table {
            margin-top: 25px;
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #888;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #eee;
        }

        .error {
            color: red;
            font-size: 0.85em;
        }
    </style>

</head>
<body>

<h2>Formulario de Registro</h2>

<form id="formPersona">
    <label>Nombre</label>
    <input type="text" id="nombre">
    <p class="error" id="errNombre"></p>

    <label>Apellido</label>
    <input type="text" id="apellido">
    <p class="error" id="errApellido"></p>

    <label>Edad</label>
    <input type="number" id="edad" min="1" max="120">
    <p class="error" id="errEdad"></p>

    <label>¿Está vivo?</label>
    <div class="radio-group">
        <input type="radio" name="vivo" value="Sí" id="vivoSi"> <label for="vivoSi">Sí</label>
        <input type="radio" name="vivo" value="No" id="vivoNo"> <label for="vivoNo">No</label>
    </div>
    <p class="error" id="errVivo"></p>

    <button type="submit" id="btnGuardar">Guardar</button>
</form>

<h2>Personas Registradas</h2>

<table id="tablaPersonas">
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Edad</th>
        <th>¿Vivo?</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    // =========================
    //  REFERENCIAS DEL DOM
    // =========================
    const form = document.getElementById("formPersona");
    const tablaBody = document.querySelector("#tablaPersonas tbody");


    // =========================
    //  FUNCIÓN: Obtener datos del formulario
    // =========================
    function obtenerDatosFormulario() {
        const vivoSeleccionado = document.querySelector('input[name="vivo"]:checked');

        return {
            nombre: document.getElementById('nombre').value.trim(),
            apellido: document.getElementById('apellido').value.trim(),
            edad: document.getElementById('edad').value.trim(),
            vivo: vivoSeleccionado ? vivoSeleccionado.value : null
        };
    }


    // =========================
    //  FUNCIÓN: Limpiar Errores
    // =========================
    function limpiarErrores() {
        document.querySelectorAll(".error").forEach(e => e.textContent = "");
    }


    // =========================
    //  FUNCIÓN: Mostrar Error
    // =========================
    function mostrarError(id, mensaje) {
        document.getElementById(id).textContent = mensaje;
    }


    // =========================
    //  FUNCIÓN: Validar Datos
    // =========================
    function validarDatos({ nombre, apellido, edad, vivo }) {
        let valido = true;

        if (!nombre) {
            mostrarError("errNombre", "El nombre no puede estar vacío.");
            valido = false;
        }

        if (!apellido) {
            mostrarError("errApellido", "El apellido no puede estar vacío.");
            valido = false;
        }

        if (!edad || isNaN(edad) || edad <= 0) {
            mostrarError("errEdad", "Edad inválida.");
            valido = false;
        }

        if (!vivo) {
            mostrarError("errVivo", "Debe seleccionar una opción.");
            valido = false;
        }

        return valido;
    }


    // =========================
    //  FUNCIÓN: Crear fila en tabla (sin innerHTML, limpio y seguro)
    // =========================
    function agregarFilaTabla({ nombre, apellido, edad, vivo }) {
        const fila = document.createElement("tr");

        [nombre, apellido, edad, vivo].forEach(valor => {
            const celda = document.createElement("td");
            celda.textContent = valor;
            fila.appendChild(celda);
        });

        tablaBody.appendChild(fila);
    }


    // =========================
    //  FUNCIÓN: Resetear formulario
    // =========================
    function resetFormulario() {
        form.reset();
    }


    // =========================
    //  EVENTO: SUBMIT DEL FORMULARIO (buena práctica)
    // =========================
    form.addEventListener("submit", (e) => {
        e.preventDefault(); // Evita que la página recargue
        limpiarErrores();

        const datos = obtenerDatosFormulario();
        const esValido = validarDatos(datos);

        if (!esValido) return;

        agregarFilaTabla(datos);
        resetFormulario();
    });
</script>

</body>
</html>
