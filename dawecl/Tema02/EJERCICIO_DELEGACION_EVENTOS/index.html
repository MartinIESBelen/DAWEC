<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <script src="index.js"></script>
    <title>Table Event Handler</title>
</head>
<body>
<table id="colorTable" class="m-1 p-1 table table-bordered">
    <thead>
    <th>Name</th>
    <th>Surname</th>
    <th>Age</th>
    <th>Alive</th>
    <th></th>
    </thead>
    <tbody>
    </tbody>
</table>


<div>
    <form id="formulario">
        <label for="input-name">Name</label>
        <input type="text" id="input-name" name="name">
        <label for="input-surname">Surname</label>
        <input type="text" id="input-surname" name="surname">
        <label for="input-age">Age</label>
        <input type="number" id="input-age" name="age">
        <label for="input-alive">Alive</label>
        <input type="checkbox" id="input-alive" name="alive">
        <button id="btn-formulario">Nuevo</button>
    </form>
</div>

</body>
</html>
