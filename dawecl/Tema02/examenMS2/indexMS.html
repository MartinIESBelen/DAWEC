<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para Crear/Editar Provincias</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 10px;
        }

        .comunidades-column {
            width: 30%;
        }

        .form-column {
            width: 70%;
            display: flex;
            flex-direction: column;
        }

        form {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin-top: 3px;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: #f5f5f5;
        }

        select[disabled] {
            background-color: #f5f5f5;
        }

        .section {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .city-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        .city-row input {
            flex: 1;
        }

        .city-row button {
            padding: 5px 10px;
            background: #ff4d4d;
            color: white;
            border: none;
            cursor: pointer;
        }

        .language-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        .language-row input {
            flex: 1;
        }

        .language-row button {
            padding: 5px 10px;
            background: #ff4d4d;
            color: white;
            border: none;
            cursor: pointer;
        }

        button.add-city, button.add-language {
            background: #4CAF50;
            color: white;
            padding: 10px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }

        button.add-city:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button[type="submit"] {
            background: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        #output {
            margin-top: 20px;
            width: 100%;
        }

        .comunidades-list {
            list-style: none;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .comunidades-list li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .comunidades-list li:hover {
            background-color: #f0f0f0;
        }

        .comunidades-list li.selected {
            background-color: #d4edda;
            font-weight: bold;
        }

        button.reset-form {
            background: green;
            color: white;
            padding: 10px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
<h1>Comunidades y Ciudades Autónomas de España</h1>
<h3 style="color: red">Martin Sierra</h3>
<div class="container">
    <div class="form-column">
        <label for="sltFiltro">Ordenar</label>
        <select id="sltFiltro" name="sltFiltro">
            <option value="nombre">Nombre</option>
            <option value="poblacionTotal">Población total</option>
        </select>
    </div>
    <div class="comunidades-column">
        <ul id="comunidadesList" class="comunidades-list"></ul>
    </div>
    <div class="form-column">
        <form id="comunidadForm">
            <label for="comunidad">Comunidad Autónoma:</label>
            <input type="text" id="comunidad" name="comunidad" required readonly>

            <label for="capital">Población Nacional:</label>
            <input type="text" id="capital" name="capital" required readonly>

            <label for="presidente">Presidente:</label>
            <input type="text" id="presidente" name="presidente" required>

            <button type="submit" id="guardar">Guardar cambios en el presidente</button>

            <textarea id="output" rows="20" cols="50" placeholder=""
                      style="margin-top: 20px; width: 100%;"></textarea>
        </form>
    </div>
</div>
<script src="ccaa.js"></script>
<script src="scriptMS.js"></script>
</body>
</html>
